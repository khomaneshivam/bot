version: '3.8'

services:
  quantai-bot:
    build:
      context: ./forex-trading-bot
      dockerfile: Dockerfile
    container_name: quantai_autonomous_bot
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - ENVIRONMENT=production
      - ALLOW_LIVE_TRADING=false
    env_file:
      - ./forex-trading-bot/.env
    volumes:
      - trading_data:/app/data
    networks:
      - trading_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.25-alpine
    container_name: quantai_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      quantai-bot:
        condition: service_healthy
    networks:
      - trading_net

volumes:
  trading_data:
    driver: local

networks:
  trading_net:
    driver: bridge
